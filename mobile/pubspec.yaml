name: mobile
description: "Socratiq — Voice-first AI tutoring mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.7.0
  record: ^5.1.2
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
